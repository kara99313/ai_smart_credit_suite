services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["python", "-m", "utils.launch", "web"]
    ports:
      - "8501:8501"
    env_file:
      - path: ../.env
        required: false
    environment:
      BACKEND_URL: http://api:8000
      API_BASE: http://api:8000
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8501"
      PORT: "8501"
      MODEL_PATH: model/logistic_pipeline_best.pkl
    volumes:
      - app_data:/app/data
      - app_reports:/app/reports
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "utils.launch", "check-web"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["python", "-m", "utils.launch", "api"]
    ports:
      - "18000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      PORT: "8000"
      MODEL_PATH: model/logistic_pipeline_best.pkl
    healthcheck:
      test: ["CMD", "python", "-m", "utils.launch", "check-api"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    restart: unless-stopped
volumes:
  app_data:
  app_reports:
